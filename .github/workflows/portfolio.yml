name: Verificar demonstração
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 > /tmp/http.log 2>&1 &
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-portfolio
          path: artifacts/
